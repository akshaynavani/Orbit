[project]
name = "orbit-mcp"
version = "0.1.0"
description = "MCP server that lets LLM clients manage Orbit tasks, notes, habits and lists"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
orbit-mcp = "orbit_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orbit_mcp"]
